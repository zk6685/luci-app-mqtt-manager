name: Build luci-app-mqtt-manager (多版本 ipk + apk)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 采用 OpenWrt 官方 gh-action-sdk 的多版本 matrix 思路：
# 一个 workflow，多版本并行，每个版本用各自版本的 SDK。
#   - 25.12 (apk 分支)  → 产出 .apk
#   - 24.10 (ipk 分支)  → 产出 .ipk
#   - 23.05 (ipk 分支)  → 产出 .ipk
jobs:
  build:
    name: Build ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 25.12
            sdk_dir: "https://downloads.immortalwrt.org/releases/25.12.0/targets/mediatek/filogic"
            compress: zst
          - version: 24.10
            sdk_dir: "https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic"
            compress: zst
          - version: 23.05
            sdk_dir: "https://downloads.immortalwrt.org/releases/23.05.7/targets/mediatek/filogic"
            compress: xz

    steps:
      - name: 检出插件源码
        uses: actions/checkout@v4

      - name: 生成编译时间戳
        run: |
          echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_ENV
          echo "PKG_VERSION=$(grep -oP '^PKG_VERSION:=\K.*' Makefile)" >> $GITHUB_ENV
          echo "版本: $(grep -oP '^PKG_VERSION:=\K.*' Makefile) / 编译日期: $BUILD_DATE / $BUILD_TIME"

      - name: 安装解压工具并下载 SDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zstd xz-utils
          SDK_FILE=$(curl -s "$SDK_DIR/" | grep -oE 'immortalwrt-sdk-[^"<]*\.tar\.(zst|xz)' | head -1)
          echo "SDK 文件: $SDK_FILE"
          if [ -z "$SDK_FILE" ]; then echo "::error::SDK 未找到"; exit 1; fi
          wget -q --timeout=300 --tries=3 -O sdk.tar.${{ matrix.compress }} "$SDK_DIR/$SDK_FILE"
          ls -la sdk.tar.${{ matrix.compress }}
        env:
          SDK_DIR: ${{ matrix.sdk_dir }}

      - name: 解压 SDK
        run: |
          mkdir -p sdk
          if [ "${{ matrix.compress }}" = "xz" ]; then
            tar -Jxf sdk.tar.xz -C sdk --strip-components=1
          else
            tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          fi
          echo "SDK 顶层:" && ls sdk/

      - name: 拷贝插件到 package
        run: |
          mkdir -p sdk/package/luci-app-mqtt-manager
          cp -r luasrc sdk/package/luci-app-mqtt-manager/
          cp -r root sdk/package/luci-app-mqtt-manager/
          cp Makefile README.md sdk/package/luci-app-mqtt-manager/
          echo "插件内容:" && ls sdk/package/luci-app-mqtt-manager/

      - name: 更新 feeds
        run: |
          cd sdk
          ./scripts/feeds update -a 2>&1 | tail -3 || true
          ./scripts/feeds install -a 2>&1 | tail -3 || true
          echo "--- 已安装 feeds ---"
          ls package/feeds/ 2>/dev/null

      - name: 修正 libubox 源码哈希漂移
        run: |
          cd sdk
          # 上游重打 libubox tag 后, feeds/base 里记录的 PKG_HASH 与实际 tarball 不符:
          #   Hash mismatch for file libubox-1.1.10.tar.zst: expected 55b2298e... got 0fecbe5f...
          # 若不修正, 编译会在 package/feeds/base/libubox 处中断。
          # 这里把该包的 PKG_HASH/PKG_MIRROR_HASH 对齐为实际下载内容。
          NEWH=0fecbe5f0d7cbdbfde93e9bc31966f8d4a3410ad04697c42ad6ba08ab7ba75c8
          for f in $(find feeds/base -path "*libs/libubox/Makefile" 2>/dev/null); do
            if grep -q "PKG_HASH:=55b2298e" "$f" 2>/dev/null; then
              sed -i "s|PKG_HASH:=55b2298e[0-9a-f]*|PKG_HASH:=$NEWH|" "$f"
              sed -i "s|PKG_MIRROR_HASH:=55b2298e[0-9a-f]*|PKG_MIRROR_HASH:=$NEWH|" "$f"
              echo "已修正 $f 的 hash"
            fi
          done
          ls dl/ 2>/dev/null | grep libubox || echo "(dl 中暂无 libubox, 编译时会重新下载)"

      - name: 编译 (${{ matrix.version }})
        run: |
          set -o pipefail   # 否则 make ... | tee | tail 会吞掉失败退出码, 造成"编译失败但步骤成功"
          cd sdk
          # 25.12/apk 分支启用 apk；24.10/23.05 用默认 ipkg 出 ipk
          if [ "${{ matrix.version }}" = "25.12" ]; then
            echo "CONFIG_USE_APK=y" > .config
            echo "CONFIG_PACKAGE_apk=y" >> .config
          fi
          make defconfig 2>&1 | tail -3
          LOG=/tmp/build_${{ matrix.version }}.log
          OK=0
          for attempt in 1 2 3; do
            if make package/luci-app-mqtt-manager/compile V=s > "$LOG" 2>&1; then
              echo "=== 编译成功 (第 $attempt 次尝试) ==="
              OK=1; break
            fi
            echo "=== 第 $attempt 次编译失败, 检查源码哈希漂移 ==="
            grep "Hash mismatch for file" "$LOG" || true
            # 上游重打 tag 会让 feeds 记录的 hash 与实际 tarball 不符,
            # 导致依赖包编译中断。这里自动把 Makefile 里的旧 hash 换成实际值后重试。
            grep "Hash mismatch for file" "$LOG" | while IFS= read -r line; do
              exp=$(printf '%s' "$line" | grep -oE 'expected [0-9a-f]{64}' | awk '{print $2}')
              got=$(printf '%s' "$line" | grep -oE 'got [0-9a-f]{64}' | awk '{print $2}')
              file=$(printf '%s' "$line" | sed -E 's/.*for file ([^:]+):.*/\1/' | tr -d ' ')
              [ -z "$exp" ] && continue
              echo "    -> $file: $exp => $got"
              for mk in $(find feeds -path "*/package/*/Makefile" 2>/dev/null || true); do
                if grep -q "$exp" "$mk" 2>/dev/null; then
                  sed -i "s/$exp/$got/g" "$mk"
                  echo "       已修正 $mk"
                fi
              done
              [ -n "$file" ] && rm -f "dl/$file"
            done
            tail -30 "$LOG"
            if [ "$attempt" = "3" ]; then
              echo "::error::编译失败(已自动修正哈希并重试 3 次)"; exit 1
            fi
          done
          [ "$OK" = "1" ] || { echo "::error::编译未成功"; exit 1; }
          tail -15 "$LOG"
          echo "=== 编译完成，收集产物 ==="

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.version }}
          path: /tmp/build_${{ matrix.version }}.log
          if-no-files-found: ignore

      - name: 收集产物 (ipk/apk)
        run: |
          mkdir -p artifact
          if [ "${{ matrix.version }}" = "25.12" ]; then
            find sdk -name "luci-app-mqtt-manager*" -name "*.apk" -exec cp {} artifact/ \; 2>/dev/null
          else
            find sdk -name "luci-app-mqtt-manager*" -name "*.ipk" -exec cp {} artifact/ \; 2>/dev/null
          fi
          printf 'Package: luci-app-mqtt-manager\nVersion: %s-r%s\nOpenWrt: %s\nBuildTime: %s\nCommit: %s\n' \
            "$PKG_VERSION" "$BUILD_DATE" "${{ matrix.version }}" "$BUILD_TIME" "${{ github.sha }}" > artifact/BUILD-INFO.txt
          echo "=== ${{ matrix.version }} 产物 ==="
          ls -la artifact/
          # 产物必须真实存在, 否则直接失败(避免空 artifact 被当成成功发布)
          if [ "${{ matrix.version }}" = "25.12" ]; then
            if ! ls artifact/*.apk >/dev/null 2>&1; then echo "::error::未生成 apk 产物"; exit 1; fi
          else
            if ! ls artifact/*.ipk >/dev/null 2>&1; then echo "::error::未生成 ipk 产物"; exit 1; fi
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mqtt-manager-${{ matrix.version }}
          path: artifact/
          if-no-files-found: warn
