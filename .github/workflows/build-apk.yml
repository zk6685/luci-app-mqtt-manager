name: Build luci-app-mqtt-manager (apk)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # mt7981b (zk-daepon) 同款 filogic 平台，aarch64
          - name: immortalwrt-filogic
            sdk_url: "https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/mediatek/filogic/immortalwrt-sdk-24.10-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            arch: aarch64

    steps:
      - name: 检出插件源码
        uses: actions/checkout@v4

      - name: 安装 zstd 并下载 SDK
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zstd
          wget -q --timeout=120 --tries=3 -O sdk.tar.zst "$SDK_URL"
          ls -la sdk.tar.zst
        env:
          SDK_URL: ${{ matrix.sdk_url }}

      - name: 解压 SDK
        run: |
          mkdir -p sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          echo "SDK 内容:" && ls sdk/ | head

      - name: 拷贝插件到 package
        run: |
          rm -rf sdk/package/luci-app-mqtt-manager
          cp -r . sdk/package/luci-app-mqtt-manager
          rm -rf sdk/package/luci-app-mqtt-manager/.git sdk/package/luci-app-mqtt-manager/.github

      - name: 更新 feeds
        run: |
          cd sdk
          ./scripts/feeds update -a 2>&1 | tail -3 || true
          ./scripts/feeds install -a 2>&1 | tail -3 || true

      - name: 编译 (生成 apk/ipk)
        run: |
          cd sdk
          make defconfig 2>&1 | tail -2
          make package/luci-app-mqtt-manager/compile V=s 2>&1 | tee /tmp/build.log | tail -30

      - name: 收集产物
        run: |
          mkdir -p artifact
          find sdk -name "luci-app-mqtt-manager*" \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} artifact/ \;
          echo "=== 产物 ==="
          ls -la artifact/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifact/
          if-no-files-found: error
