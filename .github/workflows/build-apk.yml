name: Build luci-app-mqtt-manager (ipk + apk)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ImmortalWrt filogic (aarch64, 对应 mt7981b/zk-daepon)
          - name: immortalwrt-filogic
            sdk_url: "https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/mediatek/filogic"
            arch: aarch64

    steps:
      - name: 检出插件源码
        uses: actions/checkout@v4

      - name: 安装 zstd 并下载 SDK
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zstd
          SDK_FILE=$(curl -s "$SDK_URL/" | grep -oE 'immortalwrt-sdk-[^"<]*\.tar\.zst' | head -1)
          echo "SDK 文件: $SDK_FILE"
          if [ -z "$SDK_FILE" ]; then echo "::error::SDK 未找到"; exit 1; fi
          wget -q --timeout=180 --tries=3 -O sdk.tar.zst "$SDK_URL/$SDK_FILE"
          ls -la sdk.tar.zst
        env:
          SDK_URL: ${{ matrix.sdk_url }}

      - name: 解压 SDK
        run: |
          mkdir -p sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          echo "SDK 顶层:" && ls sdk/ | head

      - name: 拷贝插件到 package
        run: |
          mkdir -p sdk/package/luci-app-mqtt-manager
          cp -r luasrc sdk/package/luci-app-mqtt-manager/
          cp -r root sdk/package/luci-app-mqtt-manager/
          cp Makefile README.md sdk/package/luci-app-mqtt-manager/
          echo "插件内容:" && ls sdk/package/luci-app-mqtt-manager/

      - name: 更新 feeds
        run: |
          cd sdk
          ./scripts/feeds update -a 2>&1 | tail -3 || true
          ./scripts/feeds install -a 2>&1 | tail -3 || true

      - name: 编译 (PKG_TARGETS 双输出 ipk + apk)
        run: |
          cd sdk
          make defconfig 2>&1 | tail -2
          make package/luci-app-mqtt-manager/compile V=s 2>&1 | tee /tmp/build.log | tail -40

      - name: 收集 ipk 和 apk 产物
        run: |
          mkdir -p artifact
          find sdk -name "luci-app-mqtt-manager*" \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} artifact/ \;
          echo "=== 产物 ==="
          ls -la artifact/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifact/
          if-no-files-found: error
