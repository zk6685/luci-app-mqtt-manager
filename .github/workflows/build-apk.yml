name: Build luci-app-mqtt-manager (.apk)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # PonWrt 目标: Airoha AN7581 (mt7981b / zk-daepon)
          - name: ponwrt-an7581
            repo: "pbs05/ponwrt"
            branch: "master"
            target: "airoha/an7581"
          # ImmortalWrt filogic (通用 aarch64 fallback)
          - name: immortalwrt-filogic
            repo: "immortalwrt/immortalwrt"
            branch: "master"
            target: "mediatek/filogic"

    steps:
      - name: 检出插件源码 (luasrc/root/Makefile)
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential ccache ecj fastjar file g++ gawk \
            gettext git libelf-dev libncurses5-dev libstdc++6 \
            python3 python3-pip python3-setuptools rsync subversion swig time unzip wget zstd

      - name: 检出 PonWrt/ImmortalWrt 源码树
        run: |
          git clone --depth 1 -b "$BRANCH" "https://github.com/$REPO.git" openwrt
          echo "源码树: $REPO @ $BRANCH"
        env:
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}

      - name: 拷贝插件到 package
        run: |
          mkdir -p openwrt/package/luci-app-mqtt-manager
          cp -r luasrc openwrt/package/luci-app-mqtt-manager/
          cp -r root openwrt/package/luci-app-mqtt-manager/
          cp Makefile README.md openwrt/package/luci-app-mqtt-manager/
          echo "插件内容:" && ls openwrt/package/luci-app-mqtt-manager/

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tail -5 || true
          ./scripts/feeds install -a 2>&1 | tail -5 || true

      - name: 配置并编译 (USE_APK 输出 .apk)
        run: |
          cd openwrt
          # 生成目标配置
          TARGET_UPPER=$(echo "$TARGET" | sed 's|/|_|g' | tr 'a-z' 'A-Z')
          echo "CONFIG_TARGET_${TARGET_UPPER}=y" > .config
          echo "CONFIG_PACKAGE_luci-app-mqtt-manager=y" >> .config
          echo "CONFIG_USE_APK=y" >> .config
          cat .config
          make defconfig 2>&1 | tail -5
          make package/luci-app-mqtt-manager/compile V=s 2>&1 | tee /tmp/build.log | tail -40
        env:
          TARGET: ${{ matrix.target }}

      - name: 收集 .apk 产物
        run: |
          mkdir -p artifact
          find openwrt/bin -name "luci-app-mqtt-manager*" \( -name "*.apk" -o -name "*.ipk" \) -exec cp {} artifact/ \;
          echo "=== 产物 ==="
          ls -la artifact/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifact/
          if-no-files-found: error
