name: Build luci-app-mqtt-manager (ipk + apk)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ImmortalWrt master SNAPSHOT SDK - filogic (aarch64, 对应 mt7981b/zk-daepon)
          - name: immortalwrt-master-sdk
            sdk_dir: "https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic"

    steps:
      - name: 检出插件源码
        uses: actions/checkout@v4

      - name: 安装 zstd 并下载 master SDK
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zstd
          SDK_FILE=$(curl -s "$SDK_DIR/" | grep -oE 'immortalwrt-sdk-[^"<]*\.tar\.zst' | head -1)
          echo "SDK 文件: $SDK_FILE"
          if [ -z "$SDK_FILE" ]; then echo "::error::SDK 未找到"; exit 1; fi
          wget -q --timeout=180 --tries=3 -O sdk.tar.zst "$SDK_DIR/$SDK_FILE"
          ls -la sdk.tar.zst
        env:
          SDK_DIR: ${{ matrix.sdk_dir }}

      - name: 解压 SDK
        run: |
          mkdir -p sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          echo "SDK 顶层:" && ls sdk/

      - name: 拷贝插件到 package
        run: |
          mkdir -p sdk/package/luci-app-mqtt-manager
          cp -r luasrc sdk/package/luci-app-mqtt-manager/
          cp -r root sdk/package/luci-app-mqtt-manager/
          cp Makefile README.md sdk/package/luci-app-mqtt-manager/
          echo "插件内容:" && ls sdk/package/luci-app-mqtt-manager/

      - name: 更新 feeds (含 luci)
        run: |
          cd sdk
          ./scripts/feeds update -a 2>&1 | tail -3 || true
          ./scripts/feeds install -a 2>&1 | tail -3 || true

      - name: 编译 IPK (默认 ipkg 输出)
        run: |
          cd sdk
          make defconfig 2>&1 | tail -3
          make package/luci-app-mqtt-manager/compile V=s 2>&1 | tee /tmp/build_ipk.log | tail -20
          mkdir -p artifact
          find sdk/bin -name "luci-app-mqtt-manager*" -name "*.ipk" -exec cp {} artifact/ \; 2>/dev/null
          find sdk -name "luci-app-mqtt-manager*" -name "*.ipk" -exec cp {} artifact/ \; 2>/dev/null
          echo "=== 已有 ipk ==="
          ls -la artifact/ 2>/dev/null

      - name: 编译 APK (启用 USE_APK 输出)
        run: |
          cd sdk
          echo "CONFIG_USE_APK=y" >> .config
          echo "CONFIG_PACKAGE_apk=y" >> .config
          make defconfig 2>&1 | tail -3
          grep -E "USE_APK" .config
          make package/luci-app-mqtt-manager/compile V=s 2>&1 | tee /tmp/build_apk.log | tail -20
          find sdk/bin -name "luci-app-mqtt-manager*" -name "*.apk" -exec cp {} artifact/ \; 2>/dev/null
          find sdk -name "luci-app-mqtt-manager*" -name "*.apk" -exec cp {} artifact/ \; 2>/dev/null
          echo "=== 全部产物 ==="
          ls -la artifact/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifact/
          if-no-files-found: error
