<%+header%>
<h2><%:MQTT Manager%> - <%:防火墙 & TLS%></h2>

<style>
.mqtt-card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:1.25rem; margin-bottom:1rem; }
.mqtt-table { width:100%; border-collapse:collapse; margin:10px 0; }
.mqtt-table th, .mqtt-table td { border:1px solid #e5e7eb; padding:8px; text-align:left; font-size:14px; }
.mqtt-table th { background:#f9fafb; font-weight:bold; }
.mqtt-btn { padding:6px 16px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.mqtt-btn-warning { background:#d97706; color:#fff; }
.mqtt-btn-primary { background:#2563eb; color:#fff; }
.mqtt-btn-success { background:#16a34a; color:#fff; }
#fw-output { background:#111827; color:#34d399; padding:1rem; border-radius:8px; white-space:pre-wrap; font-family:monospace; font-size:12px; min-height:60px; margin-top:10px; }
</style>

<div class="mqtt-card">
    <h3><%:防火墙规则%></h3>
    <table class="mqtt-table">
        <thead><tr><th><%:规则名称%></th><th><%:端口%></th></tr></thead>
        <tbody id="fw-list"></tbody>
    </table>
    <button class="mqtt-btn mqtt-btn-warning" onclick="addFwV4()"><%:添加IPv4放行1883%></button>
    <button class="mqtt-btn mqtt-btn-warning" onclick="addFwV6()"><%:添加IPv6放行1883%></button>
    <div id="fw-output"></div>
</div>

<div class="mqtt-card">
    <h3><%:TLS证书状态%></h3>
    <p style="color:#666;"><%:证书目录:%> /etc/mosquitto/cert/</p>
    <p id="tls-status" style="color:#d97706;"><%:加载中...%></p>
    <div style="margin-top:12px; padding:12px; background:#f9fafb; border-radius:6px;">
        <p style="margin:0 0 8px;font-size:13px;color:#374151;"><%:上传证书文件（请选择本地 PEM 文件）:%></p>
        <label style="font-size:13px;color:#374151;"><%:cert.pem%>: </label>
        <input type="file" id="tls-cert" accept=".pem,.crt,.cer" style="font-size:12px;">
        <br><br>
        <label style="font-size:13px;color:#374151;"><%:privkey.pem%>: </label>
        <input type="file" id="tls-key" accept=".pem,.key" style="font-size:12px;">
        <br><br>
        <button class="mqtt-btn mqtt-btn-primary" onclick="uploadTls()"><%:上传证书%></button>
        <span id="tls-tip" style="margin-left:10px;color:#16a34a;font-size:13px;"></span>
    </div>
</div>

<script type="text/javascript">
function getToken() {
    var m = document.cookie.match(/luci_token=([0-9a-f]+)/);
    return m ? m[1] : null;
}
function api(action, data) {
    var fd = new FormData();
    if (data) for (var k in data) fd.append(k, data[k]);
    var token = getToken();
    return fetch("/cgi-bin/luci/admin/services/mqtt_manager/api/" + action, {
        method: "POST", body: fd, credentials: "same-origin",
        headers: token ? {"X-Luci-Token": token} : {}
    });
}
function loadFw() {
    api("fw_list").then(function(r){return r.json()}).then(function(list){
        var tb = document.getElementById("fw-list");
        tb.innerHTML = "";
        if (!list || list.length === 0) {
            tb.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#999;"><%:暂无规则%></td></tr>';
            return;
        }
        list.forEach(function(item){
            var tr = document.createElement("tr");
            tr.innerHTML = '<td>' + item.name + '</td><td>' + item.port + '</td>';
            tb.appendChild(tr);
        });
    });
}
function fwOut(msg) {
    document.getElementById("fw-output").textContent += msg + "\n";
}
function addFwV4() {
    if (!confirm("<%:确认添加WAN口放行TCP 1883 (IPv4)？%>")) return;
    fwOut(">>> 添加 IPv4 放行 1883 ...");
    api("fw_add", {port:"1883", family:"ipv4"}).then(function(r){return r.json()}).then(function(d){
        fwOut(d.msg); loadFw();
    });
}
function addFwV6() {
    if (!confirm("<%:确认添加WAN口放行TCP 1883 (IPv6)？%>")) return;
    fwOut(">>> 添加 IPv6 放行 1883 ...");
    api("fw_add", {port:"1883", family:"ipv6"}).then(function(r){return r.json()}).then(function(d){
        fwOut(d.msg); loadFw();
    });
}
function loadTlsStatus() {
    api("tls_status").then(function(r){return r.json()}).then(function(d){
        var el = document.getElementById("tls-status");
        if (d.cert === "present") {
            el.innerHTML = "✅ <%:证书已存在%>" + (d.expire ? "，<%:到期%>: " + d.expire : "") + "，<%:大小%>: " + (d.certsize||0) + " <%:字节%>";
            el.style.color = "#16a34a";
        } else {
            el.textContent = "⚠️ <%:证书未上传，8883 端口未启用%>";
            el.style.color = "#d97706";
        }
    });
}
function uploadTls() {
    var cert = document.getElementById("tls-cert").files[0];
    var key = document.getElementById("tls-key").files[0];
    var tip = document.getElementById("tls-tip");
    if (!cert && !key) { tip.textContent = "<%:请先选择文件%>"; tip.style.color="#dc2626"; return; }
    var p = Promise.resolve();
    if (cert) {
        p = p.then(function(){
            return cert.text().then(function(txt){
                return api("tls_save", {filename:"cert.pem", content:txt}).then(function(r){return r.json()});
            });
        });
    }
    if (key) {
        p = p.then(function(){
            return key.text().then(function(txt){
                return api("tls_save", {filename:"privkey.pem", content:txt}).then(function(r){return r.json()});
            });
        });
    }
    p.then(function(){ tip.textContent = "<%:上传完成%>"; tip.style.color="#16a34a"; loadTlsStatus(); })
     .catch(function(){ tip.textContent = "<%:上传失败%>"; tip.style.color="#dc2626"; });
}
loadFw();
loadTlsStatus();
</script>
<%+footer%>
