<%+header%>
<h2><%:MQTT Manager%> - <%:防火墙规则%></h2>

<style>
.mqtt-card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:1.25rem; margin-bottom:1rem; }
.mqtt-table { width:100%; border-collapse:collapse; margin:10px 0; }
.mqtt-table th, .mqtt-table td { border:1px solid #e5e7eb; padding:8px; text-align:left; font-size:14px; }
.mqtt-table th { background:#f9fafb; font-weight:bold; }
</style>

<div class="mqtt-card">
    <h3><%:防火墙规则列表%></h3>
    <p style="color:#666;font-size:13px;"><%:添加/删除规则请在「状态」页操作%></p>
    <table class="mqtt-table">
        <thead><tr><th><%:规则名称%></th><th><%:端口%></th></tr></thead>
        <tbody id="fw-list"></tbody>
    </table>
</div>

<script type="text/javascript">
function getToken() {
    var m = document.cookie.match(/luci_token=([0-9a-f]+)/);
    return m ? m[1] : null;
}
function api(action, data) {
    var fd = new FormData();
    if (data) for (var k in data) fd.append(k, data[k]);
    var token = getToken();
    return fetch("/cgi-bin/luci/admin/services/mqtt_manager/api/" + action, {
        method: "POST", body: fd, credentials: "same-origin",
        headers: token ? {"X-Luci-Token": token} : {}
    });
}
function loadFw() {
    api("fw_list").then(function(r){return r.json()}).then(function(list){
        var tb = document.getElementById("fw-list");
        tb.innerHTML = "";
        if (!list || list.length === 0) {
            tb.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#999;"><%:暂无规则，请到状态页添加%></td></tr>';
            return;
        }
        list.forEach(function(item){
            var tr = document.createElement("tr");
            tr.innerHTML = '<td>' + item.name + '</td><td>' + item.port + '</td>';
            tb.appendChild(tr);
        });
    });
}
loadFw();
</script>
<%+footer%>
