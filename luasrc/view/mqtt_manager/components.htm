<%+header%>
<h2><%:MQTT Manager%> - <%:组件管理%></h2>

<style>
.mqtt-card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:1.25rem; margin-bottom:1rem; }
.mqtt-table { width:100%; border-collapse:collapse; margin:10px 0; }
.mqtt-table th, .mqtt-table td { border:1px solid #e5e7eb; padding:8px; text-align:left; font-size:14px; }
.mqtt-table th { background:#f9fafb; font-weight:bold; }
.mqtt-btn { padding:6px 16px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.mqtt-btn-success { background:#16a34a; color:#fff; }
.ok { color:#16a34a; font-weight:bold; }
.err { color:#dc2626; font-weight:bold; }
</style>

<div class="mqtt-card">
    <h3><%:组件安装状态%></h3>
    <table class="mqtt-table">
        <thead><tr><th><%:组件%></th><th><%:状态%></th><th><%:操作%></th></tr></thead>
        <tbody id="comp-list"></tbody>
    </table>
    <p style="color:#666;font-size:13px;"><%:注: 组件安装使用系统包管理器 (apk/opkg)%></p>
</div>

<script type="text/javascript">
function getToken() {
    var m = document.cookie.match(/luci_token=([0-9a-f]+)/);
    return m ? m[1] : null;
}
function api(action, data) {
    var fd = new FormData();
    if (data) for (var k in data) fd.append(k, data[k]);
    var token = getToken();
    return fetch("/cgi-bin/luci/admin/services/mqtt_manager/api/" + action, {
        method: "POST", body: fd, credentials: "same-origin",
        headers: token ? {"X-Luci-Token": token} : {}
    });
}
function loadComp() {
    api("check_components").then(function(r){return r.json()}).then(function(list){
        var tb = document.getElementById("comp-list");
        tb.innerHTML = "";
        if (!list || list.length === 0) {
            tb.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;"><%:无数据%></td></tr>';
            return;
        }
        list.forEach(function(item){
            var tr = document.createElement("tr");
            var status = item.status === "installed"
                ? '<span class="ok">✅ <%:已安装%></span>' + (item.version ? ' <span style="color:#6b7280;font-size:12px;">v' + item.version + '</span>' : '')
                : '<span class="err">❌ <%:未安装%></span>';
            var btn = "";
            if (item.status === "installed") {
                btn = '<button class="mqtt-btn mqtt-btn-primary" onclick="uninstallPkg(\'' + item.name + '\')"><%:卸载%></button>';
                if (item.name === "mosquitto") btn += ' <span style="color:#dc2626;font-size:12px;">⚠️ <%:卸载将停止Broker%></span>';
            } else {
                btn = '<button class="mqtt-btn mqtt-btn-success" onclick="installPkg(\'' + item.name + '\')"><%:安装%></button>';
            }
            tr.innerHTML = '<td>' + item.name + '</td><td>' + status + '</td><td>' + btn + '</td>';
            tb.appendChild(tr);
        });
    });
}
function installPkg(pkg) {
    if (!confirm("<%:确认安装 %>" + pkg + " ?")) return;
    api("install_component", {pkg:pkg}).then(function(r){return r.json()}).then(function(d){
        alert(d.msg);
        setTimeout(loadComp, 8000);
    });
}
function uninstallPkg(pkg) {
    if (!confirm("<%:确认卸载 %>" + pkg + " ? <%:该操作会移除该组件%>")) return;
    api("uninstall_component", {pkg:pkg}).then(function(r){return r.json()}).then(function(d){
        alert(d.msg);
        setTimeout(loadComp, 3000);
    });
}
loadComp();
</script>
<%+footer%>
