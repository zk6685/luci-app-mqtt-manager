<%+header%>
<h2><%:MQTT Manager%> - <%:基础配置%></h2>

<style>
.mqtt-card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:1.25rem; margin-bottom:1rem; }
.mqtt-row { display:flex; align-items:center; margin:8px 0; gap:10px; }
.mqtt-row label { width:130px; color:#374151; font-size:14px; }
.mqtt-row input { padding:6px 10px; border:1px solid #d1d5db; border-radius:6px; width:260px; }
.mqtt-row select { padding:6px 10px; border:1px solid #d1d5db; border-radius:6px; width:260px; }
.mqtt-btn { padding:6px 16px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.mqtt-btn-primary { background:#2563eb; color:#fff; }
.mqtt-btn-success { background:#16a34a; color:#fff; }
.mqtt-path { background:#f1f5f9; border:1px solid #e2e8f0; border-radius:6px; padding:8px 12px; font-family:monospace; font-size:13px; color:#0f172a; }
#cfg-output { background:#111827; color:#34d399; padding:1rem; border-radius:8px; white-space:pre-wrap; font-family:monospace; font-size:13px; min-height:100px; margin-top:10px; }
#raw-conf { width:100%; min-height:260px; font-family:monospace; font-size:12px; padding:10px; border:1px solid #d1d5db; border-radius:6px; background:#0f172a; color:#e2e8f0; }
</style>

<div class="mqtt-card">
    <h3><%:配置文件%></h3>
    <div class="mqtt-row">
        <label><%:配置模式%>:</label>
        <select id="conf-mode" onchange="switchMode()">
            <option value="uci">UCI 模式（/etc/config/mosquitto）</option>
            <option value="file">文件模式（直接改 mosquitto.conf）</option>
        </select>
        <span id="mode-tip" style="color:#6b7280;font-size:12px;"></span>
    </div>
    <div class="mqtt-row">
        <label><%:配置文件路径%>:</label>
        <span id="conf-path" class="mqtt-path">/etc/config/mosquitto</span>
    </div>
    <div class="mqtt-row">
        <button class="mqtt-btn mqtt-btn-primary" onclick="loadConfig()"><%:读取配置%></button>
        <button class="mqtt-btn mqtt-btn-primary" onclick="runConfCheck()"><%:检测配置完整性%></button>
        <button class="mqtt-btn" style="background:#d97706;color:#fff;" onclick="runConfFix()"><%:一键修复%></button>
        <span id="tip" style="margin-left:10px;color:#16a34a;font-size:13px;"></span>
    </div>
    <div class="mqtt-row">
        <div id="conf-check-out" style="width:100%;"></div>
    </div>
</div>

<div class="mqtt-card">
    <h3><%:关键配置项%></h3>
    <div class="mqtt-row"><label><%:监听端口%> (listener):</label><input id="cfg-port" placeholder="1883"></div>
    <div class="mqtt-row"><label><%:允许匿名%> (allow_anonymous):</label>
        <select id="cfg-anon">
            <option value="false">false - 禁止匿名（推荐）</option>
            <option value="true">true - 允许匿名</option>
        </select></div>
    <div class="mqtt-row"><label><%:密码文件%> (password_file):</label><input id="cfg-passfile" placeholder="/etc/mosquitto/passwd"></div>
    <div class="mqtt-row"><label><%:持久化%> (persistence):</label>
        <select id="cfg-persist">
            <option value="false">false - 关闭</option>
            <option value="true">true - 开启</option>
        </select></div>
    <div class="mqtt-row"><label><%:日志输出%> (log_dest):</label>
        <select id="cfg-logdest">
            <option value="syslog">输出到系统日志</option>
            <option value="file /var/log/mosquitto/mosquitto.log">写入日志文件</option>
            <option value="stdout">输出到标准输出</option>
        </select></div>
    <div class="mqtt-row" style="margin-top:12px;">
        <button class="mqtt-btn mqtt-btn-primary" onclick="applyKeyConfig()"><%:保存关键配置%></button>
        <span id="key-tip" style="margin-left:10px;color:#16a34a;font-size:13px;"></span>
    </div>
</div>

<div class="mqtt-card">
    <h3><%:完整配置（可编辑）%></h3>
    <textarea id="raw-conf" spellcheck="false"></textarea>
    <p style="color:#6b7280;font-size:12px;margin-top:6px;" id="raw-path-tip"><%:直接修改配置文件内容，保存后校验并重启 Mosquitto。%></p>
    <div class="mqtt-row" style="margin-top:8px;">
        <button class="mqtt-btn mqtt-btn-success" onclick="applyRawConfig()"><%:保存完整配置并应用%></button>
        <span id="raw-tip" style="margin-left:10px;color:#16a34a;font-size:13px;"></span>
    </div>
</div>

<div class="mqtt-card">
    <h3><%:TLS 证书（8883端口）%></h3>
    <p style="color:#666;font-size:13px;"><%:证书目录:%> /etc/mosquitto/cert/</p>
    <p id="tls-status" style="color:#d97706;"><%:加载中...%></p>
    <div style="margin-top:12px; padding:12px; background:#f9fafb; border-radius:6px;">
        <p style="margin:0 0 8px;font-size:13px;color:#374151;"><%:上传证书文件（PEM 格式）:%></p>
        <label style="font-size:13px;color:#374151;"><%:cert.pem%>: </label>
        <input type="file" id="tls-cert" accept=".pem,.crt,.cer" style="font-size:12px;">
        <br><br>
        <label style="font-size:13px;color:#374151;"><%:privkey.pem%>: </label>
        <input type="file" id="tls-key" accept=".pem,.key" style="font-size:12px;">
        <br><br>
        <button class="mqtt-btn mqtt-btn-primary" onclick="uploadTls()"><%:上传证书%></button>
        <span id="tls-tip" style="margin-left:10px;color:#16a34a;font-size:13px;"></span>
    </div>
</div>

<script type="text/javascript">
function getToken() {
    var m = document.cookie.match(/luci_token=([0-9a-f]+)/);
    return m ? m[1] : null;
}
function api(action, data) {
    var fd = new FormData();
    if (data) for (var k in data) fd.append(k, data[k]);
    var token = getToken();
    return fetch("/cgi-bin/luci/admin/services/mqtt_manager/api/" + action, {
        method: "POST", body: fd, credentials: "same-origin",
        headers: token ? {"X-Luci-Token": token} : {}
    });
}
function setTip(t, color) {
    var el = document.getElementById("tip");
    el.textContent = t;
    el.style.color = color || "#16a34a";
}
function runConfCheck() {
    var el = document.getElementById("conf-check-out");
    el.textContent = "<%:正在检查...%>";
    api("conf_check", {}).then(function(r){return r.text()}).then(function(t){ el.textContent = t; })
    .catch(function(e){ el.textContent = "<%:检查失败:%> " + e; el.style.color="#dc2626"; });
}
function runConfFix() {
    if (!confirm("<%:确认自动修复所有配置问题？将强制 use_uci=1、设置 password_file、修复属主权限、删除重复 listener。%>")) return;
    var el = document.getElementById("conf-check-out");
    el.textContent = "<%:正在修复...%>";
    api("conf_check", {fix:"1"}).then(function(r){return r.text()}).then(function(t){
        el.textContent = t;
        el.textContent += "\n<%:修复完成，刷新状态...%>";
        setTimeout(loadStatusIfExists, 1500);
    }).catch(function(e){ el.textContent = "<%:修复失败:%> " + e; el.style.color="#dc2626"; });
}
function loadStatusIfExists() {
    // 状态页徽标不受影响；此处仅提示可去状态页查看
}
function loadConfig() {    api("conf_read").then(function(r){return r.json()}).then(function(d){
        if (!d) return;
        var modeSel = document.getElementById("conf-mode");
        if (d.mode) { modeSel.value = d.mode; document.getElementById("mode-tip").textContent = d.mode === "uci" ? "<%:通过 UCI 管理，系统自动生成 conf%>" : "<%:直接读写 mosquitto.conf%>"; }
        document.getElementById("conf-path").textContent = d.path;
        if (d.port) document.getElementById("cfg-port").value = d.port;
        if (d.anon !== "") document.getElementById("cfg-anon").value = d.anon;
        if (d.passfile) document.getElementById("cfg-passfile").value = d.passfile;
        if (d.persist !== "") document.getElementById("cfg-persist").value = d.persist;
        if (d.logdest) document.getElementById("cfg-logdest").value = d.logdest;
        if (d.raw) document.getElementById("raw-conf").value = d.raw;
        setTip("<%:配置已读取%>");
    }).catch(function(){ setTip("<%:读取失败%>", "#dc2626"); });
}
function switchMode() {
    var target = document.getElementById("conf-mode").value;
    if (!confirm(target === "uci" ? "<%:切换到 UCI 模式？配置将存到 /etc/config/mosquitto%>" : "<%:切换到文件模式？直接管理 /etc/mosquitto/mosquitto.conf%>")) {
        loadConfig(); return;
    }
    setTip("<%:正在切换...%>");
    api("conf_switch", {target:target}).then(function(r){return r.json()}).then(function(d){
        setTip(d.msg || "<%:已切换%>");
        loadConfig();
    }).catch(function(){ setTip("<%:切换失败%>", "#dc2626"); });
}
function applyKeyConfig() {
    var keyvals = [
        ["listener", document.getElementById("cfg-port").value.trim()],
        ["allow_anonymous", document.getElementById("cfg-anon").value],
        ["password_file", document.getElementById("cfg-passfile").value.trim()],
        ["persistence", document.getElementById("cfg-persist").value],
        ["log_dest", document.getElementById("cfg-logdest").value]
    ];
    var el = document.getElementById("key-tip");
    el.textContent = "<%:正在保存...%>"; el.style.color = "#16a34a";
    var p = Promise.resolve();
    keyvals.forEach(function(kv){
        p = p.then(function(){
            return api("conf_set", {key:kv[0], val:kv[1]}).then(function(r){return r.json()});
        });
    });
    p.then(function(){ return api("conf_apply").then(function(r){return r.json()}); })
     .then(function(d){ el.textContent = "<%:已保存并重启 Mosquitto%>"; })
     .catch(function(){ el.textContent = "<%:保存失败%>"; el.style.color = "#dc2626"; });
}
function applyRawConfig() {
    var raw = document.getElementById("raw-conf").value;
    var el = document.getElementById("raw-tip");
    el.textContent = "<%:正在保存...%>"; el.style.color = "#16a34a";
    api("conf_raw_save", {raw:raw}).then(function(r){return r.json()})
     .then(function(d){
         el.textContent = d.msg || "<%:已保存%>";
         return api("conf_apply").then(function(r2){return r2.json()});
     })
     .then(function(){ el.textContent = el.textContent + " · " + "<%:已重启%>"; })
     .catch(function(){ el.textContent = "<%:保存失败%>"; el.style.color = "#dc2626"; });
}
function loadTlsStatus() {
    api("tls_status").then(function(r){return r.json()}).then(function(d){
        var el = document.getElementById("tls-status");
        if (d.cert === "present") {
            el.innerHTML = "✅ <%:证书已存在%>" + (d.expire ? "，<%:到期%>: " + d.expire : "") + "，<%:大小%>: " + (d.certsize||0) + " <%:字节%>";
            el.style.color = "#16a34a";
        } else {
            el.textContent = "⚠️ <%:证书未上传，8883 端口未启用%>";
            el.style.color = "#d97706";
        }
    });
}
function uploadTls() {
    var cert = document.getElementById("tls-cert").files[0];
    var key = document.getElementById("tls-key").files[0];
    var tip = document.getElementById("tls-tip");
    if (!cert && !key) { tip.textContent = "<%:请先选择文件%>"; tip.style.color="#dc2626"; return; }
    var p = Promise.resolve();
    if (cert) {
        p = p.then(function(){
            return cert.text().then(function(txt){
                return api("tls_save", {filename:"cert.pem", content:txt}).then(function(r){return r.json()});
            });
        });
    }
    if (key) {
        p = p.then(function(){
            return key.text().then(function(txt){
                return api("tls_save", {filename:"privkey.pem", content:txt}).then(function(r){return r.json()});
            });
        });
    }
    p.then(function(){ tip.textContent = "<%:上传完成%>"; tip.style.color="#16a34a"; loadTlsStatus(); })
     .catch(function(){ tip.textContent = "<%:上传失败%>"; tip.style.color="#dc2626"; });
}
loadConfig();
loadTlsStatus();
</script>
<%+footer%>
