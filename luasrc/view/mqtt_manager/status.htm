<%+header%>
<h2><%:MQTT Manager%> - <%:状态%></h2>

<style>
.mqtt-card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:1.25rem; margin-bottom:1rem; }
.mqtt-status-badge { display:inline-block; padding:6px 16px; border-radius:20px; font-size:15px; font-weight:bold; }
.badge-running { background:#dcfce7; color:#16a34a; }
.badge-stopped { background:#fee2e2; color:#dc2626; }
.mqtt-btn { padding:6px 16px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.mqtt-btn-primary { background:#2563eb; color:#fff; }
.mqtt-btn-warning { background:#d97706; color:#fff; }
#mqtt-output { background:#111827; color:#34d399; padding:1rem; border-radius:8px; white-space:pre-wrap; font-family:monospace; font-size:13px; min-height:200px; margin-top:10px; }
</style>

<div class="mqtt-card">
    <h3><%:服务状态%></h3>
    <p><%:Mosquitto 服务%>: <span id="svc-badge" class="mqtt-status-badge badge-stopped"><%:检测中...%></span></p>
    <p><%:监听端口%>: 1883 (IPv4+IPv6双栈)</p>
    <div style="margin:10px 0; padding:10px; background:#f9fafb; border-radius:6px;">
        <label style="font-size:13px;color:#374151;margin-right:8px;"><%:巡检测试账号%>:</label>
        <input id="inspect-user" value="zk6685" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;width:120px;">
        <input id="inspect-pass" type="password" placeholder="<%:密码%>" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;width:120px;margin-left:6px;">
        <span style="font-size:12px;color:#6b7280;margin-left:6px;"><%:留空则自动取密码文件首个用户%></span>
        <br>
        <label style="font-size:13px;color:#374151;margin-right:8px;display:inline-block;margin-top:8px;"><%:外网域名%>:</label>
        <input id="inspect-host" placeholder="<%:如 zk6685.top%>" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;width:160px;">
        <input id="inspect-port" placeholder="<%:端口 默认1883%>" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;width:80px;margin-left:6px;">
        <span style="font-size:12px;color:#6b7280;margin-left:6px;"><%:填写则测试外网连通，留空跳过%></span>
    </div>
    <p style="margin-top:12px;">
        <button class="mqtt-btn" style="background:#16a34a;color:#fff;" onclick="svcAction('start')"><%:启动%></button>
        <button class="mqtt-btn" style="background:#dc2626;color:#fff;" onclick="svcAction('stop')"><%:停止%></button>
        <button class="mqtt-btn mqtt-btn-primary" onclick="svcAction('restart')"><%:重启服务%></button>
        <button class="mqtt-btn mqtt-btn-primary" onclick="runInspect()"><%:一键巡检%></button>
        <button class="mqtt-btn mqtt-btn-warning" onclick="fwAdd('ipv4')"><%:防火墙放行IPv4%></button>
        <button class="mqtt-btn mqtt-btn-warning" onclick="fwAdd('ipv6')"><%:防火墙放行IPv6%></button>
        <button class="mqtt-btn mqtt-btn-primary" onclick="clearOutput()"><%:清空输出%></button>
    </p>
    <div id="mqtt-output"></div>
</div>

<script type="text/javascript">
function getToken() {
    var m = document.cookie.match(/luci_token=([0-9a-f]+)/);
    return m ? m[1] : null;
}
function api(action, data) {
    var fd = new FormData();
    if (data) for (var k in data) fd.append(k, data[k]);
    var token = getToken();
    return fetch("/cgi-bin/luci/admin/services/mqtt_manager/api/" + action, {
        method: "POST", body: fd, credentials: "same-origin",
        headers: token ? {"X-Luci-Token": token} : {}
    });
}
function outAppend(msg) {
    document.getElementById("mqtt-output").textContent += msg + "\n";
}
function loadStatus() {
    api("status").then(function(r){return r.json()}).then(function(d){
        var b = document.getElementById("svc-badge");
        if (d.status === "running") { b.className = "mqtt-status-badge badge-running"; b.textContent = "<%:运行中%>"; }
        else { b.className = "mqtt-status-badge badge-stopped"; b.textContent = "<%:已停止%>"; }
    }).catch(function(){});
}
function svcAction(act) {
    var out = document.getElementById("mqtt-output");
    var label = act === "start" ? "<%:启动%>" : act === "stop" ? "<%:停止%>" : "<%:重启%>";
    if (act !== "start" && !confirm("<%:确认%>" + label + "<%: Mosquitto？%>")) return;
    out.textContent = ">>> " + label + "Mosquitto...\n";
    api(act).then(function(r){return r.json()}).then(function(d){
        outAppend(d.msg);
        outAppend(">>> 刷新状态...");
        setTimeout(loadStatus, 2000);
        setTimeout(function(){
            api("status").then(function(r){return r.json()}).then(function(s){
                outAppend(s.status === "running" ? "<%:结果: 服务运行中%>" : "<%:结果: 服务已停止%>");
            });
        }, 3000);
    }).catch(function(e){ outAppend("<%:操作失败:%> " + e); });
}
function runInspect() {
    var out = document.getElementById("mqtt-output");
    out.textContent = "<%:正在巡检...%>";
    var u = document.getElementById("inspect-user").value;
    var p = document.getElementById("inspect-pass").value;
    var h = document.getElementById("inspect-host").value;
    var pt = document.getElementById("inspect-port").value;
    api("inspect", {user:u, pass:p, host:h, port:pt}).then(function(r){return r.text()}).then(function(t){ out.textContent = t; })
    .catch(function(e){ out.textContent = "<%:巡检失败:%> " + e; });
}
function fwAdd(family) {
    var label = family === "ipv4" ? "IPv4" : "IPv6";
    if (!confirm("<%:确认添加WAN口放行TCP 1883 (%1)？%>".replace("%1", label))) return;
    outAppend(">>> 添加防火墙 " + label + " 放行 1883 ...");
    api("fw_add", {port:"1883", family:family}).then(function(r){return r.json()}).then(function(d){
        outAppend(d.msg);
    });
}
function clearOutput() { document.getElementById("mqtt-output").textContent = ""; }
loadStatus();
</script>
<%+footer%>
