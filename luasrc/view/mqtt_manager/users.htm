<%+header%>
<h2><%:MQTT Manager%> - <%:用户管理%></h2>

<style>
.mqtt-card { background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:1.25rem; margin-bottom:1rem; }
.mqtt-table { width:100%; border-collapse:collapse; margin:10px 0; }
.mqtt-table th, .mqtt-table td { border:1px solid #e5e7eb; padding:8px; text-align:left; font-size:14px; }
.mqtt-table th { background:#f9fafb; font-weight:bold; }
.mqtt-row { display:flex; align-items:center; margin:8px 0; gap:10px; }
.mqtt-row label { width:80px; color:#374151; font-size:14px; }
.mqtt-row input { padding:6px 10px; border:1px solid #d1d5db; border-radius:6px; width:260px; }
.mqtt-btn { padding:6px 16px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.mqtt-btn-success { background:#16a34a; color:#fff; }
.mqtt-btn-danger { background:#dc2626; color:#fff; }
.mqtt-btn-sm { padding:3px 10px; font-size:12px; }
</style>

<div class="mqtt-card">
    <h3><%:MQTT用户列表%></h3>
    <table class="mqtt-table">
        <thead><tr><th><%:用户名%></th><th><%:操作%></th></tr></thead>
        <tbody id="user-list"></tbody>
    </table>
</div>

<div class="mqtt-card">
    <h3><%:添加新用户%></h3>
    <div class="mqtt-row"><label><%:用户名%></label><input id="new-username"></div>
    <div class="mqtt-row"><label><%:密码%></label><input id="new-password" type="password"></div>
    <button class="mqtt-btn mqtt-btn-success" onclick="addUser()"><%:添加用户%></button>
    <span id="tip" style="margin-left:10px;color:#16a34a;"></span>
</div>

<script type="text/javascript">
function getToken() {
    var m = document.cookie.match(/luci_token=([0-9a-f]+)/);
    return m ? m[1] : null;
}
function api(action, data) {
    var fd = new FormData();
    if (data) for (var k in data) fd.append(k, data[k]);
    // 空表单会导致 LuCI ucode 解析边界报错 500，补一个占位字段
    fd.append("_x", "1");
    var token = getToken();
    return fetch("/cgi-bin/luci/admin/services/mqtt_manager/api/" + action, {
        method: "POST", body: fd, credentials: "same-origin",
        headers: token ? {"X-Luci-Token": token} : {}
    });
}
function loadUsers() {
    api("list_users").then(function(r){return r.json()}).then(function(users){
        var tb = document.getElementById("user-list");
        tb.innerHTML = "";
        if (!users || users.length === 0) {
            tb.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#999;"><%:暂无用户%></td></tr>';
            return;
        }
        users.forEach(function(u){
            var tr = document.createElement("tr");
            tr.innerHTML = '<td>' + u + '</td><td><button class="mqtt-btn mqtt-btn-danger mqtt-btn-sm" onclick="delUser(\'' + u + '\')"><%:删除%></button></td>';
            tb.appendChild(tr);
        });
    });
}
function delUser(u) {
    if (!confirm("<%:确认删除用户 %>" + u + " ?")) return;
    api("del_user", {username:u}).then(function(){ loadUsers(); });
}
function addUser() {
    var u = document.getElementById("new-username").value.trim();
    var p = document.getElementById("new-password").value;
    if (!u || !p) { alert("<%:用户名密码不能为空%>"); return; }
    api("add_user", {username:u, password:p}).then(function(r){return r.json()}).then(function(d){
        document.getElementById("tip").textContent = d.msg;
        document.getElementById("new-username").value = "";
        document.getElementById("new-password").value = "";
        loadUsers();
    });
}
loadUsers();
</script>
<%+footer%>
